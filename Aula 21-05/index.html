<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Formulários</title>
</head>
<body>
    <h1>Introdução a formulários</h1>
    <div class="conteudo-formulario">
        <form>
            <label for="pNome">Nome: </label>
            <input type="text" name="Nome" id="pNome" placeholder="Digite seu nome ">

            <br><br>

            <label for="pSobrenome">Sobrenome: </label>
            <input type="text" name="Sobrenome" id="pSobrenome" placeholder="Agora seu Sobrenome">

            <h3>Selecione seu curso:</h3>
            <input type="radio" name="curso" id="tinf">
            <label for="tinf">Técnico Informática</label>
            <input type="radio" name="curso" id="tcont">
            <label for="tinf">Técnico Contabilidade</label>
            <input type="radio" name="curso" id="adm">
            <label for="tinf">Técnico Aministração</label>
            <input type="radio" name="curso" id="tele">
            <label for="tinf">Técnico Eletrônica</label>

            <h3>Dados da plataforma:</h3>
            <label for="ednEmail">Email: </label>
            <input type="Email" id="endEmail">
            <br><br>
            <label for="senha">Defina uma senha:</label>
            <input type="password">

        </form>
    </div>
</body>
</html>
